syntax = "proto3";

package master;

message Server
{
    string EndPoint = 1;
    ServerData Data = 2;
}

message ServerData
{
    int32 svMaxclients = 1;
    int32 clients = 2;
    string hostname = 4;
    string gametype = 5;
    string mapname = 6;
    string server = 9;
    // Verified against the live streamRedir payload: iconVersion is a typed field
    // (field 11), never a var. Zero (field absent) = no icon; any non-zero value —
    // including negative — is a valid icon version.
    int64 iconVersion = 11;
    map<string, string> vars = 12;
    repeated string connectEndPoints = 18;
}