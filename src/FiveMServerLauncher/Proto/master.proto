syntax = "proto3";

package master;

message Server
{
    string EndPoint = 1;
    ServerData Data = 2;
}

message ServerData
{
    int32 svMaxclients = 1;
    int32 clients = 2;
    string hostname = 4;
    string gametype = 5;
    string mapname = 6;
    string server = 9;
    // Historical (pre-2026-10) icon source: CFX stopped publishing this typed
    // field when icons moved to the `icon_url` var (cfx-server-metadata serves the
    // actual bytes, as WebP). Verified live 2026-10-26: 0/33,548 servers carry it.
    // Kept as wire-format documentation; nothing consumes it.
    int64 iconVersion = 11;
    map<string, string> vars = 12;
    repeated string connectEndPoints = 18;
}